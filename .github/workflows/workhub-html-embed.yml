# Work Hub: AFFiNE 0.27.4 + live HTML attachment embeds.
# Produces a self-host server image (official 0.27.4 server, patched web UI)
# and an ad-hoc-signed macOS arm64 desktop app from the same commit.
name: Work Hub HTML embed build

on:
  push:
    branches:
      - selfhost/0.27.4-html-embed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: workhub-html-embed-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.27.4
  BUILD_TYPE: stable
  UPSTREAM_IMAGE: ghcr.io/toeverything/affine:0.27.4
  IMAGE: ghcr.io/heli-konton/affine

jobs:
  check:
    name: Lint + typecheck attachment block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - name: oxlint
        run: yarn oxlint --deny-warnings blocksuite/affine/blocks/attachment/src
      - name: oxfmt
        run: yarn oxfmt --check blocksuite/affine/blocks/attachment/src packages/frontend/apps/electron/forge.config.mjs
      - name: tsc
        run: yarn tsc -b blocksuite/affine/blocks/attachment/tsconfig.json

  build-web:
    name: Build @affine/web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - name: Build web
        run: yarn affine @affine/web build
      - name: Confirm patch is in the bundle
        run: grep -rlq "affine-attachment-html-embed" packages/frontend/apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: packages/frontend/apps/web/dist
          if-no-files-found: error

  image:
    name: Server image
    needs: [check, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - name: Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          ARG UPSTREAM_IMAGE
          FROM ${UPSTREAM_IMAGE}
          # Replace the web UI only; keep upstream admin + mobile bundles.
          RUN find /app/static -mindepth 1 -maxdepth 1 ! -name admin ! -name mobile -exec rm -rf {} +
          COPY web/ /app/static/
          LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}
          LABEL org.opencontainers.image.description="AFFiNE 0.27.4 + Work Hub live HTML embeds"
          EOF
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          docker build --pull --build-arg UPSTREAM_IMAGE="$UPSTREAM_IMAGE" \
            -t "$IMAGE:0.27.4-htmlembed-$short" -t "$IMAGE:0.27.4-htmlembed" .
          docker push "$IMAGE:0.27.4-htmlembed-$short"
          docker push "$IMAGE:0.27.4-htmlembed"
          {
            echo "### Image"
            echo "\`$IMAGE:0.27.4-htmlembed-$short\`"
            docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:0.27.4-htmlembed-$short"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop-web:
    name: Build desktop renderer
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: generate-assets
        run: yarn affine @affine/electron generate-assets
        env:
          RELEASE_VERSION: ${{ env.APP_VERSION }}
      - name: Confirm patch is in the bundle
        run: grep -rlq "affine-attachment-html-embed" packages/frontend/apps/electron/resources/web-static
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web
          path: packages/frontend/apps/electron/resources/web-static
          if-no-files-found: error

  desktop-macos:
    name: macOS arm64 app
    needs: desktop-web
    runs-on: macos-latest
    env:
      RELEASE_VERSION: 0.27.4
      APP_NAME: affine
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      SKIP_GENERATE_ASSETS: 1
      SKIP_OSX_SIGN: 1
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        timeout-minutes: 15
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/electron @affine/monorepo @affine/nbstore @toeverything/infra
          hard-link-nm: false
          nmHoistingLimits: workspaces
          enableScripts: false
      - name: Build AFFiNE native
        uses: ./.github/actions/build-rust
        with:
          target: aarch64-apple-darwin
          package: '@affine/native'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: packages/frontend/apps/electron/resources/web-static
      - name: Build desktop layers
        run: yarn affine @affine/electron build
      - name: Trim node_modules
        run: |
          cargo clean
          rm -rf packages/frontend/apps/electron/node_modules/@affine/nbstore/node_modules/@blocksuite
          rm -rf packages/frontend/apps/electron/node_modules/@affine/native/node_modules
      - name: Package
        run: yarn affine @affine/electron package --platform=darwin --arch=arm64
        env:
          SKIP_WEB_BUILD: 1
          HOIST_NODE_MODULES: 1
          NODE_OPTIONS: --max-old-space-size=14384
      - name: Ad-hoc sign + zip
        run: |
          app=$(find packages/frontend/apps/electron/out -maxdepth 3 -name 'AFFiNE.app' -type d | head -1)
          test -n "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p builds
          ditto -c -k --sequesterRsrc --keepParent "$app" builds/AFFiNE-0.27.4-htmlembed-macos-arm64.zip
          shasum -a 256 builds/*.zip | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: affine-macos-arm64
          path: builds
          if-no-files-found: error
