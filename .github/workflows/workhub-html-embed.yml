# Work Hub: AFFiNE 0.27.4 + live HTML attachment embeds.
# Produces the patched web UI (artifact `web`, baked into the self-host image
# by .github/deployment/workhub/Dockerfile) and an ad-hoc-signed macOS arm64
# desktop app (artifact `affine-macos-arm64`) from the same commit.
name: Work Hub HTML embed build

on:
  push:
    branches:
      - selfhost/0.27.4-html-embed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workhub-html-embed-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 0.27.4
  BUILD_TYPE: stable

jobs:
  check:
    name: Lint + typecheck attachment block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - name: oxlint
        run: yarn oxlint --deny-warnings blocksuite/affine/blocks/attachment/src
      - name: oxfmt
        run: yarn oxfmt --check blocksuite/affine/blocks/attachment/src packages/frontend/apps/electron/forge.config.mjs
      - name: tsc
        run: yarn tsc -b blocksuite/affine/blocks/attachment/tsconfig.json

  build-web:
    name: Build @affine/web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - name: Build web
        run: yarn affine @affine/web build
      - name: Confirm patch is in the bundle
        run: grep -rlq "affine-attachment-html-embed" packages/frontend/apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: packages/frontend/apps/web/dist
          if-no-files-found: error

  image:
    # GHCR rejects GITHUB_TOKEN pushes from this fork, so CI only proves the
    # image builds; the lab host builds the same Dockerfile from the `web`
    # artifact (see .github/deployment/workhub/Dockerfile).
    name: Server image (build check)
    needs: [check, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/deployment/workhub
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: .github/deployment/workhub/web
      - name: Build
        run: |
          docker build --pull -t workhub/affine:0.27.4-htmlembed .github/deployment/workhub
          docker run --rm --entrypoint sh workhub/affine:0.27.4-htmlembed \
            -c 'grep -rlq affine-attachment-html-embed /app/static/js && ls /app/static/admin /app/static/mobile >/dev/null'

  desktop-web:
    name: Build desktop renderer
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: generate-assets
        run: yarn affine @affine/electron generate-assets
        env:
          RELEASE_VERSION: ${{ env.APP_VERSION }}
      - name: Confirm patch is in the bundle
        run: grep -rlq "affine-attachment-html-embed" packages/frontend/apps/electron/resources/web-static
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web
          path: packages/frontend/apps/electron/resources/web-static
          if-no-files-found: error

  desktop-macos:
    name: macOS arm64 app
    needs: desktop-web
    runs-on: macos-latest
    env:
      RELEASE_VERSION: 0.27.4
      APP_NAME: affine
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      SKIP_GENERATE_ASSETS: 1
      SKIP_OSX_SIGN: 1
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        timeout-minutes: 15
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/electron @affine/monorepo @affine/nbstore @toeverything/infra
          hard-link-nm: false
          nmHoistingLimits: workspaces
          enableScripts: false
      - name: Build AFFiNE native
        uses: ./.github/actions/build-rust
        with:
          target: aarch64-apple-darwin
          package: '@affine/native'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: packages/frontend/apps/electron/resources/web-static
      - name: Build desktop layers
        run: yarn affine @affine/electron build
      - name: Trim node_modules
        run: |
          cargo clean
          rm -rf packages/frontend/apps/electron/node_modules/@affine/nbstore/node_modules/@blocksuite
          rm -rf packages/frontend/apps/electron/node_modules/@affine/native/node_modules
      - name: Package
        run: yarn affine @affine/electron package --platform=darwin --arch=arm64
        env:
          SKIP_WEB_BUILD: 1
          HOIST_NODE_MODULES: 1
          NODE_OPTIONS: --max-old-space-size=14384
      - name: Ad-hoc sign + zip
        run: |
          app=$(find packages/frontend/apps/electron/out -maxdepth 3 -name 'AFFiNE.app' -type d | head -1)
          test -n "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p builds
          ditto -c -k --sequesterRsrc --keepParent "$app" builds/AFFiNE-0.27.4-htmlembed-macos-arm64.zip
          shasum -a 256 builds/*.zip | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: affine-macos-arm64
          path: builds
          if-no-files-found: error
