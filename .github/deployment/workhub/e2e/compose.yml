name: affine-htmltest
# Disposable test stack for the Work Hub HTML-embed image. Fresh data,
# loopback-only, no Tailscale route. Remove with: docker compose down -v
x-affine-env: &affine-env
  REDIS_SERVER_HOST: redis
  DATABASE_URL: postgresql://affine:${DB_PASSWORD}@postgres:5432/affine
  AFFINE_INDEXER_ENABLED: "false"
  AFFINE_SERVER_EXTERNAL_URL: http://127.0.0.1:3020

services:
  affine:
    image: ${TEST_IMAGE}
    ports:
      - "127.0.0.1:3020:3010"
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      affine_migration: {condition: service_completed_successfully}
    volumes:
      - storage:/root/.affine/storage
      - config:/root/.affine/config
    environment: *affine-env

  affine_migration:
    image: ${TEST_IMAGE}
    volumes:
      - storage:/root/.affine/storage
      - config:/root/.affine/config
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment: *affine-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - pg:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: affine
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "affine", "-d", "affine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage:
  config:
  pg:
