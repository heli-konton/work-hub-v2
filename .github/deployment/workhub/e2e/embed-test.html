<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Embed test</title>
    <style>
      body { font-family: sans-serif; margin: 16px; background: #fdf6e3; }
      #count { font-size: 28px; }
    </style>
  </head>
  <body>
    <h1 id="title">HTML embed test</h1>
    <p id="js">JS did not run</p>
    <p id="sandbox">sandbox unchecked</p>
    <button id="btn">Click me</button>
    <span id="count">0</span>
    <script>
      document.getElementById('js').textContent = 'JS OK';
      let n = 0;
      document.getElementById('btn').addEventListener('click', () => {
        n += 1;
        document.getElementById('count').textContent = String(n);
      });
      let parentAccess;
      try {
        parentAccess = 'PARENT READABLE: ' + window.parent.document.title;
      } catch (e) {
        parentAccess = 'parent blocked (' + e.name + ')';
      }
      let storage;
      try {
        window.localStorage.getItem('x');
        storage = 'storage readable';
      } catch (e) {
        storage = 'storage blocked (' + e.name + ')';
      }
      document.getElementById('sandbox').textContent = parentAccess + '; ' + storage;
    </script>
  </body>
</html>
